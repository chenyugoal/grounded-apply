[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "grounded-apply"
version = "0.1.0a0"
description = "A local-first, evidence-backed job search assistant for Codex."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Grounded Apply contributors" }]
keywords = ["jobs", "resume", "provenance", "local-first", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
backup = ["cryptography>=50.0.1,<51"]

[project.scripts]
gapply = "grounded_apply.cli:main"

[project.urls]
Repository = "https://github.com/grounded-apply/grounded-apply"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_apply"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "grounded_apply/migrations"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
